name: Sync docs

# Pulls the source repository's Markdown into content/docs/ and opens a PR
# when the result differs from what's committed here.
#
# Three ways in, on purpose:
#
#   - repository_dispatch — monark-community/app fires this the moment a
#     merge to develop touches its docs (see notify-docs.yml over there).
#     Fastest path, but it needs a credential on the app side.
#   - schedule — a daily sweep. This is what makes the pipeline work with
#     zero setup: if the dispatch is never wired up (or its token lapses),
#     the docs still land, just a day later instead of a minute later.
#   - workflow_dispatch — manual, with an optional ref for syncing a
#     branch before it merges.
#
# A PR rather than a direct push to main: a docs edit upstream can break
# the build here (MDX is stricter than Markdown), and the diff is worth a
# glance — this is the moment the app's prose becomes a public web page.
# The job runs `pnpm build` before proposing anything, so a PR that exists
# is a PR that compiles.

on:
  repository_dispatch:
    types: [docs-updated]
  schedule:
    # 06:00 UTC daily. Nothing to do on most days: no diff, no PR, one
    # cheap run.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA of monark-community/app to sync from"
        required: false
        default: develop

concurrency:
  # Never two syncs racing for the same branch; let a running one finish
  # rather than cancelling it mid-push.
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  SOURCE_REPO: monark-community/app
  SYNC_BRANCH: docs-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: source
        run: |
          REF="${{ github.event.client_payload.ref || inputs.ref || 'develop' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Syncing from $SOURCE_REPO@$REF"

      - name: Checkout docs site
        uses: actions/checkout@v6

      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.source.outputs.ref }}
          path: .app-source
          # Prose only — no need for the source repo's history.
          fetch-depth: 1
          # Don't leave this job's token in .app-source/.git/config; nothing
          # here pushes to the source repo.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync docs
        run: pnpm sync:docs --source .app-source --clean

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- content/docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "content/docs is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- content/docs
          fi

      # The gate that earns the PR: MDX is stricter than Markdown, so an
      # upstream edit can compile fine as a .md and still fail here. Running
      # the export before opening the PR means a red build never reaches a
      # reviewer as a "just merge it" docs change.
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: pnpm build

      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, force-updated: the PR stays open and its
          # diff always reflects the current upstream, instead of a new PR
          # piling up on every docs edit.
          git switch -C "$SYNC_BRANCH"
          git add content/docs
          git commit -m "docs: sync from $SOURCE_REPO@$SOURCE_REF"
          git push --force origin "$SYNC_BRANCH"

          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $SYNC_BRANCH — its diff now reflects this run."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "docs: sync from $SOURCE_REPO" \
            --body "$(cat <<EOF
          Generated by [\`sync-docs.yml\`](.github/workflows/sync-docs.yml) from \`$SOURCE_REPO@$SOURCE_REF\`.

          \`content/docs/\` is generated — edit the prose in the source repository and let this
          workflow bring it across. The site's static export was built from this content before
          the PR was opened, so the MDX compiles.

          This branch is force-updated on every sync, so the diff always reflects the current
          upstream rather than accumulating commits.
          EOF
          )"
